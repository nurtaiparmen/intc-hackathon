{% if field.field.widget.input_type == "checkbox" %}
<div class="field field--check">
  {{ field }}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
</div>
{% else %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
{% endif %}
